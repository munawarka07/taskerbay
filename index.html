<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, viewport-fit=cover">
<title>TaskerBay</title>
<meta name="description" content="Private workspace.">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="theme-color" content="#0E7A74" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1113" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="TaskerBay">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="root">
  <div class="splash"><div class="brand-mark big"><span></span></div><b>TaskerBay</b></div>
</div>
<div class="backdrop" id="backdrop"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title"></div>
<div class="toast" id="toast" role="status"><span id="toast-msg"></span><button id="toast-undo" type="button">Undo</button></div>
<div class="palette-wrap" id="palette-wrap"><div class="palette" role="dialog" aria-label="Search and commands"><label for="pal-input" class="sr">Search</label><input id="pal-input" placeholder="Search or ask: overdue for Sara, done last month…" autocomplete="off"><div class="pal-list" id="pal-list"></div></div></div>
<canvas id="confetti"></canvas>
<script type="module" src="js/app.js"></script>
</body>
</html>
